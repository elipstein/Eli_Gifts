name: Supabase keep-alive

# Free-tier Supabase pauses idle projects. A background write with the secret key
# did NOT count as activity (it paused anyway), so this instead mimics a real
# visitor: the public url + publishable key running a *varied* read of the ideas
# table (see scripts/keepalive.mjs). Runs several times a day; also manual.
on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours (offset off the hour to dodge scheduler congestion)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/keepalive.mjs
